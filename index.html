<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAOIS DE CHUPI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at center, #1e0b36 0%, #090214 100%);
      color: #fff;
    }

    .neon-text-pink {
      text-shadow: 0 0 10px rgba(255, 0, 127, 0.8), 0 0 20px rgba(255, 0, 127, 0.5);
    }

    .neon-glow-img {
      filter: drop-shadow(0 0 12px rgba(236, 72, 153, 0.9)) drop-shadow(0 0 25px rgba(236, 72, 153, 0.6));
      animation: neonPulse 2s infinite alternate;
    }

    @keyframes neonPulse {
      0% { filter: drop-shadow(0 0 8px rgba(236, 72, 153, 0.7)) drop-shadow(0 0 15px rgba(236, 72, 153, 0.4)); }
      100% { filter: drop-shadow(0 0 16px rgba(236, 72, 153, 1)) drop-shadow(0 0 30px rgba(236, 72, 153, 0.8)); }
    }

    .popup-bubble {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.3) translateY(100px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(236, 72, 153, 0.5);
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6 flex flex-col items-center justify-between selection:bg-pink-500 selection:text-white">

  <!-- TOP HEADER & CASH PRIZE POOL -->
  <header class="w-full max-w-5xl flex flex-col md:flex-row items-center justify-between gap-4 mb-4">
    <div class="flex items-center gap-3 text-center md:text-left">
      <!-- LOGO CON EFECTO NEÓN -->
      <img src="papoichupi.png" alt="Papo y Chupi Logo" class="w-20 h-20 md:w-24 md:h-24 object-contain neon-glow-img">
      <div>
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400 neon-text-pink">
          RULETA DE PAPOIS 🍻
        </h1>
        <p class="text-gray-400 text-sm md:text-base font-semibold">¡Gana puntos, cumple retos y llévate el pozo!</p>
      </div>
    </div>

    <!-- POZO DE DINERO -->
    <div class="bg-gradient-to-r from-yellow-500/20 via-amber-500/10 to-yellow-500/20 border-2 border-yellow-500/50 rounded-2xl p-3 md:p-4 flex items-center gap-4 shadow-lg shadow-yellow-500/10">
      <div class="text-3xl md:text-4xl">💰</div>
      <div>
        <div class="text-xs uppercase font-extrabold tracking-widest text-yellow-400">Pozo Acumulado</div>
        <div id="prize-pool-display" class="text-2xl md:text-3xl font-black text-yellow-300">$0</div>
      </div>
      <div class="border-l border-yellow-500/30 pl-3">
        <label class="text-[10px] uppercase font-bold text-gray-400 block">Apuesta c/u</label>
        <input type="number" id="bet-input" value="1000" step="500" min="0" onchange="updatePrizePool()" class="w-20 bg-black/40 border border-yellow-500/40 rounded px-2 py-1 text-xs text-yellow-300 font-bold focus:outline-none focus:border-yellow-400">
      </div>
    </div>
  </header>

  <!-- MAIN GAME AREA -->
  <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start my-auto">
    
    <!-- LEFT PANEL: PLAYERS & LEADERBOARD -->
    <section class="lg:col-span-4 bg-slate-900/80 backdrop-blur-md border border-purple-500/30 rounded-3xl p-5 shadow-2xl order-2 lg:order-1">
      <h2 class="text-xl font-black text-pink-400 mb-4 flex items-center justify-between">
        <span>🏆 POSICIONES</span>
        <span class="text-xs font-normal text-gray-400">Meta: <strong class="text-pink-400" id="target-score-display">100 pts</strong></span>
      </h2>

      <!-- ADD PLAYER INPUT -->
      <div class="flex gap-2 mb-4">
        <input type="text" id="player-name-input" placeholder="Nombre jugador..." class="flex-1 bg-black/50 border border-purple-500/40 rounded-xl px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500">
        <button onclick="addPlayer()" class="bg-pink-600 hover:bg-pink-500 font-bold px-4 py-2 rounded-xl text-sm transition-all shadow-lg shadow-pink-600/30">
          + Agregar
        </button>
      </div>

      <!-- LEADERBOARD LIST -->
      <div id="leaderboard" class="space-y-2 max-h-[300px] lg:max-h-[400px] overflow-y-auto pr-1">
        <!-- Dynamic Player Items -->
      </div>
    </section>

    <!-- RIGHT PANEL: ROULETTE & TURN DISPLAY -->
    <section class="lg:col-span-8 flex flex-col items-center justify-center order-1 lg:order-2">
      
      <!-- CURRENT TURN BANNER -->
      <div id="turn-banner" class="mb-4 bg-gradient-to-r from-pink-600/30 via-purple-600/30 to-pink-600/30 border border-pink-500/50 px-6 py-2 rounded-full backdrop-blur-md shadow-lg shadow-pink-500/20 text-center">
        <span class="text-xs uppercase font-bold text-gray-300 block tracking-widest">TURNO DE</span>
        <span id="current-player-name" class="text-2xl md:text-3xl font-black text-pink-300">¡Añade Jugadores!</span>
      </div>

      <!-- WHEEL CONTAINER -->
      <div class="relative w-full max-w-[550px] aspect-square flex items-center justify-center my-2">
        <!-- POINTER -->
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-20 w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[35px] border-t-pink-500 drop-shadow-[0_0_10px_rgba(236,72,153,0.8)]"></div>

        <!-- CANVAS -->
        <canvas id="canvas" width="800" height="800" class="w-full h-full rounded-full border-4 border-pink-500/50 shadow-[0_0_50px_rgba(236,72,153,0.3)] bg-black/40"></canvas>

        <!-- CENTER SPIN BUTTON -->
        <button id="spin-btn" onclick="spin()" class="absolute z-10 w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-tr from-pink-600 via-rose-500 to-purple-600 border-4 border-white shadow-[0_0_30px_rgba(244,63,94,0.8)] font-black text-xl md:text-2xl text-white hover:scale-105 active:scale-95 transition-transform flex items-center justify-center tracking-wider">
          ¡GIRAR!
        </button>
      </div>

    </section>
  </main>

  <!-- RESULT POPUP MODAL (GLOBO BURBUJA) -->
  <div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="popup-bubble w-full max-w-lg bg-gradient-to-b from-slate-900 via-purple-950 to-slate-900 border-2 border-pink-500 rounded-3xl p-6 md:p-8 text-center shadow-[0_0_60px_rgba(236,72,153,0.5)] relative overflow-hidden">
      
      <div id="modal-badge" class="inline-block px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest bg-pink-500/20 text-pink-300 border border-pink-500/40 mb-3">
        VERDAD
      </div>

      <h3 id="modal-player" class="text-lg font-bold text-gray-300 mb-2">Turno de: Player</h3>

      <div id="modal-text" class="text-2xl md:text-3xl font-black text-white leading-snug my-4 text-balance">
        ¿Texto de la prenda o pregunta aquí?
      </div>

      <!-- POINTS ACTION BUTTONS -->
      <div class="grid grid-cols-2 gap-4 mt-6">
        <button onclick="handleResult(true)" class="bg-gradient-to-r from-emerald-600 to-green-500 hover:from-emerald-500 hover:to-green-400 text-white font-black py-3 px-4 rounded-2xl shadow-lg shadow-green-600/40 text-base md:text-lg flex flex-col items-center transition-transform active:scale-95">
          <span>¡CUMPLIÓ!</span>
          <span class="text-xs font-bold text-green-200 opacity-90">+20 PUNTOS</span>
        </button>

        <button onclick="handleResult(false)" class="bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white font-black py-3 px-4 rounded-2xl shadow-lg shadow-red-600/40 text-base md:text-lg flex flex-col items-center transition-transform active:scale-95">
          <span>NO CUMPLIÓ</span>
          <span class="text-xs font-bold text-red-200 opacity-90">-15 PUNTOS</span>
        </button>
      </div>

    </div>
  </div>

  <!-- WINNER CELEBRATION MODAL -->
  <div id="winner-modal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 flex items-center justify-center p-4 hidden">
    <div class="popup-bubble w-full max-w-md bg-gradient-to-b from-yellow-950 via-slate-900 to-black border-2 border-yellow-500 rounded-3xl p-8 text-center shadow-[0_0_80px_rgba(234,179,8,0.6)]">
      <div class="text-6xl mb-2">👑</div>
      <h2 class="text-xs uppercase font-extrabold tracking-widest text-yellow-400">¡TENEMOS UN CAMPEÓN!</h2>
      <h1 id="winner-name" class="text-4xl font-black text-white my-2">JUGADOR</h1>
      <p class="text-gray-300 text-sm">Se lleva el gran pozo acumulado de:</p>
      <div id="winner-prize" class="text-4xl font-black text-yellow-300 my-4">$0</div>

      <button onclick="closeWinnerModal()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 text-black font-black py-3 rounded-xl text-lg shadow-lg shadow-yellow-500/30 hover:scale-105 transition-transform">
        ¡NUEVA PARTIDA!
      </button>
    </div>
  </div>

  <script>
    // --- QUESTIONS & DARES ARRAYS ---
    const truths = [
      "¿Quién de esta mesa crees que tiene la vida amorosa más desastrosa?",
      "¿Qué es lo más ridículo que has hecho por venganza después de una ruptura?",
      "¿Alguna vez te ha gustado el/la hermano/a o familiar de un amigo?",
      "¿Cuál ha sido la mentira más elaborada que dijiste para faltar al trabajo o a un compromiso?",
      "¿Qué es lo primero que le miras físicamente a alguien que te atrae?",
      "¿Has revisado el teléfono de tu pareja o ex sin su permiso?",
      "¿Alguna vez has tenido un romance en el trabajo o lugar de estudio?",
      "¿Cuál ha sido tu momento más embarazoso frente a alguien que te gustaba?",
      "¿Qué es lo más raro o inusual que te genera atracción en una persona?",
      "¿Has fingido estar ebrio/a para justificar algo que hiciste o dijiste?",
      "¿Alguna vez te sacaron de un boliche o fiesta por mala conducta?",
      "¿Quién en esta mesa crees que oculta el secreto más turbio?",
      "¿Has enviado un mensaje comprometedor al grupo o persona equivocada?",
      "¿Qué hábito asqueroso tienes cuando nadie te está viendo?",
      "¿Alguna vez te han atrapado haciendo algo indebido en público?",
      "¿Qué es lo máximo que has durado sin bañarte y por qué?",
      "¿Has fingido un orgasmo o que te la estabas pasando bien solo para terminar rápido?",
      "¿Qué rumor falso inventaron sobre ti que terminó siendo creído por muchos?",
      "¿Alguna vez te gustó alguien solo por el dinero o estatus que tenía?",
      "¿Qué es lo más feo que le has dicho a alguien en medio de una discusión?",
      "¿Has usado a alguien para olvidar a tu ex?",
      "¿Alguna vez te atrajo un/a profesor/a o jefe/a?",
      "¿Cuál es la foto más comprometedora que tienes actualmente en tu celular?",
      "¿Alguna vez te fuiste de un lugar sin pagar la cuenta o sin avisar?",
      "¿Qué es lo más infantil que sigues haciendo a tu edad?",
      "¿Has tenido un sueño erótico con alguien presente en esta mesa?",
      "¿Qué opinión mala tienes sobre la pareja actual o pasada de algún amigo aquí?",
      "¿Alguna vez te besaste con dos personas distintas en una misma noche?",
      "¿Qué es lo más tóxico que le has pedido a una pareja que haga?",
      "¿Has bloqueado a alguien solo porque no soportabas verlo feliz?",
      "¿Cuál es el regalo más feo o barato que has hecho por compromiso?",
      "¿Alguna vez inventaste que se murió un familiar para zafar de un plan?",
      "¿Qué es lo más vergonzoso que ha visto tu historial de búsqueda en internet?",
      "¿Alguna vez te invitaron a una fiesta y te sentiste totalmente excluido?",
      "¿Qué es lo más arriesgado o ilegal que has hecho sin que te atrapen?",
      "¿Quién de los presentes te caía mal al principio y por qué?",
      "¿Alguna vez te arrepentiste de acostarte con alguien apenas terminaron?",
      "¿Qué es lo más humillante que hiciste para pedir perdón a alguien?",
      "¿Has fingido que te gusta un tipo de música o hobby solo para encajar con alguien?",
      "¿Cuál ha sido la excusa más mala que te han dado para no salir contigo?",
      "¿Alguna vez escuchaste a tus padres o vecinos haciendo ruidos íntimos?",
      "¿Qué es lo que nunca le perdonarías a tu mejor amigo/a?",
      "¿Alguna vez te quedaste dormido/a en una cita o durante un momento íntimo?",
      "¿Qué persona del pasado borrarías por completo de tu vida si pudieras?",
      "¿Has borrado chats de WhatsApp antes de verte con tu pareja por miedo a que los vea?",
      "¿Qué es lo más tacaño que has hecho en una salida o cita?",
      "¿Alguna vez te han rechazado brutalmente en público?",
      "¿Quién de los presentes crees que sería el primero en terminar en prisión?",
      "¿Has besado a alguien solo para darles celos a otra persona?",
      "¿Qué confesión harías ahora mismo si supieras que no habrá consecuencias?"
    ];

    const dares = [
      "Deja que la persona a tu izquierda envíe un emoji a la tercera persona en tu chat de WhatsApp.",
      "Tómate una foto graciosa haciéndote muecas y ponla de foto de perfil durante 1 hora.",
      "Actúa como un perro y pide comida a 3 personas de la mesa.",
      "Envía un audio cantando el estribillo de una canción romántica a un contacto aleatorio.",
      "Publica en tu estado de WhatsApp: 'Necesito un consejo amoroso urgente, hablenme al privado'.",
      "Déjate maquillar o pintar la cara por el jugador que tenga el menor puntaje.",
      "Baila sin música intensamente durante 45 segundos en medio del grupo.",
      "Lee en voz alta las últimas 5 búsquedas que hiciste en tu navegador web.",
      "Permite que el grupo elija un apodo vergonzoso con el que te llamarán por el resto del juego.",
      "Deja que el jugador de tu derecha revolviera tu cabello y te peine como quiera.",
      "Dedícale un poema improvisado de 4 versos a la persona que tienes enfrente.",
      "Haz 15 flexiones de brazos o 20 sentadillas seguidas.",
      "Dale la mano al jugador a tu izquierda hasta que sea tu próximo turno.",
      "Simula ser un comentarista deportivo narrando lo que hace cada jugador por 2 minutos.",
      "Soporta que te hagan cosquillas por 15 segundos sin poder moverte ni gritar.",
      "Camina en pasarela mostrando tu mejor outfit como si fueras modelo profesional.",
      "Habla con acento extranjero (español, mexicano o italiano) durante las próximas 3 rondas.",
      "Haz una declaración de amor dramática a un objeto de la habitación.",
      "Déjate tomar una foto vergonzosa que solo el grupo podrá conservar.",
      "Bebe un vaso con agua sin usar las manos.",
      "Susurra un secreto inocente al oído de la persona a tu derecha.",
      "Envía la palabra 'Hola, te extraño' a un contacto elegido al azar por el grupo.",
      "Imita la forma de hablar o caminar de uno de los jugadores hasta que lo adivinen.",
      "Intenta tocarte la punta de la nariz con la lengua frente a todos.",
      "Haz una llamada a un amigo y convéncelo de que ganaste la lotería durante 1 minuto.",
      "Sostén una cubito de hielo en tu mano hasta que se derrita por completo.",
      "Haz 3 saltos de tijera gritando '¡Soy una estrella!' en cada salto.",
      "Lame tu propio codo (o inténtalo con todas tus fuerzas por 20 segundos).",
      "Permite que alguien te escriba una palabra en el brazo con un marcador.",
      "Canta una canción infantil con voz de ópera.",
      "Muestra la foto más vieja que tengas guardada en la galería de tu teléfono.",
      "Intenta guiñar un ojo y sonreír de forma seductora a cada integrante de la mesa.",
      "Realiza una imitación de tu celebridad o personaje animado favorito.",
      "Recita el abecedario al revés lo más rápido que puedas sin equivocarte.",
      "Tómate un shot de picante o algo con mucho limón.",
      "Deja que el jugador con más puntos revise tus mensajes archivados de WhatsApp.",
      "Quédate congelado en una pose graciosa durante un minuto completo.",
      "Envía un sticker aleatorio a tu jefe o familiar sin agregar texto.",
      "Haz de cuenta que estás participando en un comercial de televisión vendiendo un vaso vacío.",
      "Lámete el labio de forma exagerada mirando fijamente a alguien por 10 segundos.",
      "Di 3 virtudes sinceras de la persona que peor te caiga o tengas menos afinidad en la mesa.",
      "Intercambia el calzado con la persona a tu derecha durante 2 rondas.",
      "Muestra la última nota escrita que tengas en la app de notas de tu teléfono.",
      "Ponte de rodillas y pide perdón a un jugador por algo ficticio que le hayas hecho.",
      "Intenta hacer malabares con 3 objetos pequeños durante 15 segundos.",
      "Cuenta un chiste tan malo que haga reír a alguien por lo malo que es.",
      "Pide permiso a un jugador para oler su perfume directamente en su cuello.",
      "Haz ruido de animal salvaje cada vez que alguien diga tu nombre durante 2 rondas.",
      "Gira sobre ti mismo 10 veces y trata de caminar en línea recta sin caerte."
    ];

    // --- ROULETTE SLICES CONFIGURATION ---
    const slices = [
      { label: "VERDAD", type: "truth", color: "#ec4899" },
      { label: "BEBES 2", type: "action", text: "Bebes 2 sorbos de tu trago.", color: "#8b5cf6" },
      { label: "CONSECUENCIA", type: "dare", color: "#ef4444" },
      { label: "TODOS BEBEN", type: "action", text: "¡Todos en la mesa beben un sorbo!", color: "#f59e0b" },
      { label: "VERDAD", type: "truth", color: "#ec4899" },
      { label: "SORBO AL REVÉS", type: "action", text: "Intenta beber un sorbo con la cabeza hacia abajo.", color: "#10b981" },
      { label: "CONSECUENCIA", type: "dare", color: "#ef4444" },
      { label: "BEBEN MENOS TÚ", type: "action", text: "¡Todos beben menos tú!", color: "#3b82f6" },
      { label: "VERDAD", type: "truth", color: "#ec4899" },
      { label: "CHUPITO DOBLE", type: "action", text: "Trae un vaso de chupito, sírvete y dale duro dos veces.", color: "#8b5cf6" },
      { label: "CONSECUENCIA", type: "dare", color: "#ef4444" },
      { label: "OBLIGA A ALGUIEN", type: "action", text: "Elige a cualquier persona para que dé un buen sorbo.", color: "#f59e0b" },
      { label: "VERDAD", type: "truth", color: "#ec4899" },
      { label: "BEBE 3", type: "action", text: "Bebe 3 sorbos grandes de tu vaso.", color: "#10b981" },
      { label: "CONSECUENCIA", type: "dare", color: "#ef4444" },
      { label: "PERREO 30S", type: "action", text: "Ponen reggaetón y perreas durante 30 segundos.", color: "#3b82f6" }
    ];

    // --- STATE MANAGEMENT ---
    let players = [];
    let currentPlayerIndex = 0;
    let targetScore = 100;
    let isSpinning = false;
    let currentAngle = 0;
    let currentSlice = null;

    let remainingTruths = [...truths];
    let remainingDares = [...dares];

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const numSlices = slices.length;
    const arcSize = (2 * Math.PI) / numSlices;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function drawWheel() {
      const radius = canvas.width / 2;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < numSlices; i++) {
        const angle = currentAngle + i * arcSize;
        
        ctx.beginPath();
        ctx.fillStyle = slices[i].color;
        ctx.moveTo(radius, radius);
        ctx.arc(radius, radius, radius - 10, angle, angle + arcSize);
        ctx.lineTo(radius, radius);
        ctx.fill();

        ctx.strokeStyle = '#090214';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.translate(radius, radius);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 26px 'Outfit', sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.8)";
        ctx.shadowBlur = 8;
        ctx.fillText(slices[i].label, radius - 35, 10);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(radius, radius, radius - 5, 0, 2 * Math.PI);
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 6;
      ctx.stroke();
    }

    function addPlayer() {
      const input = document.getElementById("player-name-input");
      const name = input.value.trim();
      if (!name) return;

      players.push({ name, score: 0, wins: 0, fails: 0 });
      input.value = "";
      updateLeaderboard();
      updateTurnDisplay();
      updatePrizePool();
    }

    function updateLeaderboard() {
      const list = document.getElementById("leaderboard");
      list.innerHTML = "";

      const sorted = [...players].sort((a, b) => b.score - a.score);

      if (sorted.length === 0) {
        list.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">Ingresa nombres para comenzar el juego.</p>`;
        return;
      }

      sorted.forEach((p, rank) => {
        const originalIndex = players.indexOf(p);
        const isCurrent = originalIndex === currentPlayerIndex && players.length > 0;
        
        const item = document.createElement("div");
        item.className = `flex items-center justify-between p-3 rounded-2xl border transition-all ${
          isCurrent ? 'bg-pink-500/20 border-pink-500/60 shadow-lg shadow-pink-500/10' : 'bg-black/30 border-purple-500/20'
        }`;

        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-black text-sm w-6 text-center ${rank === 0 ? 'text-yellow-400 text-lg' : 'text-gray-500'}">
              ${rank === 0 ? '👑' : '#' + (rank + 1)}
            </span>
            <div>
              <div class="font-bold text-sm ${isCurrent ? 'text-pink-300' : 'text-white'}">${p.name}</div>
              <div class="text-[10px] text-gray-400">✔️ ${p.wins} | ❌ ${p.fails}</div>
            </div>
          </div>
          <div class="font-black text-lg ${p.score >= 0 ? 'text-green-400' : 'text-red-400'}">
            ${p.score} <span class="text-xs text-gray-400 font-normal">pts</span>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function updateTurnDisplay() {
      const banner = document.getElementById("current-player-name");
      if (players.length === 0) {
        banner.innerText = "¡Añade Jugadores!";
      } else {
        banner.innerText = players[currentPlayerIndex].name;
      }
    }

    function updatePrizePool() {
      const bet = parseFloat(document.getElementById("bet-input").value) || 0;
      const total = bet * players.length;
      document.getElementById("prize-pool-display").innerText = `$${total.toLocaleString()}`;
    }

    function spin() {
      if (isSpinning) return;
      if (players.length === 0) {
        alert("¡Por favor añade al menos un jugador antes de girar!");
        return;
      }

      isSpinning = true;
      let lastTick = 0;
      const spinAngle = Math.random() * 2000 + 3500;
      const duration = 4500;
      let start = null;

      function animate(timestamp) {
        if (!start) start = timestamp;
        const progress = (timestamp - start) / duration;

        if (progress < 1) {
          const easeOut = 1 - Math.pow(1 - progress, 4);
          currentAngle = easeOut * (spinAngle * Math.PI / 180);

          if (Math.floor(currentAngle / arcSize) !== lastTick) {
            playTickSound();
            lastTick = Math.floor(currentAngle / arcSize);
          }

          drawWheel();
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          showModalResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showModalResult() {
      const degrees = (currentAngle * 180 / Math.PI) % 360;
      const effectiveAngle = (360 - degrees + 270) % 360;
      const index = Math.floor(effectiveAngle / (360 / numSlices));
      currentSlice = slices[index];

      const modal = document.getElementById("result-modal");
      const badge = document.getElementById("modal-badge");
      const text = document.getElementById("modal-text");
      const playerLabel = document.getElementById("modal-player");

      playerLabel.innerText = `Turno de: ${players[currentPlayerIndex].name}`;

      if (currentSlice.type === "truth") {
        badge.innerText = "VERDAD 🤐";
        badge.className = "inline-block px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest bg-pink-500/20 text-pink-300 border border-pink-500/40 mb-3";
        if (remainingTruths.length === 0) remainingTruths = [...truths];
        const randIdx = Math.floor(Math.random() * remainingTruths.length);
        text.innerText = remainingTruths.splice(randIdx, 1)[0];
      } else if (currentSlice.type === "dare") {
        badge.innerText = "CONSECUENCIA 🔥";
        badge.className = "inline-block px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest bg-red-500/20 text-red-300 border border-red-500/40 mb-3";
        if (remainingDares.length === 0) remainingDares = [...dares];
        const randIdx = Math.floor(Math.random() * remainingDares.length);
        text.innerText = remainingDares.splice(randIdx, 1)[0];
      } else {
        badge.innerText = "ACCIÓN / BEBIDA 🍻";
        badge.className = "inline-block px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest bg-amber-500/20 text-amber-300 border border-amber-500/40 mb-3";
        text.innerText = currentSlice.text;
      }

      modal.classList.remove("hidden");
    }

    function handleResult(success) {
      const p = players[currentPlayerIndex];

      if (success) {
        p.score += 20;
        p.wins++;
      } else {
        p.score -= 15;
        p.fails++;
      }

      document.getElementById("result-modal").classList.add("hidden");

      if (p.score >= targetScore) {
        triggerWinner(p);
        return;
      }

      currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      updateLeaderboard();
      updateTurnDisplay();
    }

    function triggerWinner(player) {
      confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
      const bet = parseFloat(document.getElementById("bet-input").value) || 0;
      const totalPrize = bet * players.length;

      document.getElementById("winner-name").innerText = player.name;
      document.getElementById("winner-prize").innerText = `$${totalPrize.toLocaleString()}`;
      document.getElementById("winner-modal").classList.remove("hidden");
    }

    function closeWinnerModal() {
      document.getElementById("winner-modal").classList.add("hidden");
      players.forEach(p => { p.score = 0; p.wins = 0; p.fails = 0; });
      currentPlayerIndex = 0;
      updateLeaderboard();
      updateTurnDisplay();
    }

    // Dibujar ruleta cuando la tipografía cargue o inmediatamente
    document.fonts.ready.then(() => drawWheel());
    drawWheel();
    updateLeaderboard();
  </script>
</body>
</html>
